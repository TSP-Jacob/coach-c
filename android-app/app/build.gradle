plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.coachecall.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.coachecall.app"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "2.1"

        // This app is a thin WebView shell around the real Coach-C site —
        // UI/feature changes ship via a normal web deploy, no app rebuild
        // needed. See project_coachc_dashboard_app memory for why (the
        // native reimplementation kept drifting from the backend's actual
        // behavior — five real bugs in one session).
        buildConfigField "String", "WEB_URL", "\"${localProperties['WEB_URL'] ?: 'https://coach-c-theta.vercel.app'}\""
    }

    signingConfigs {
        release {
            def ksPath = localProperties['RELEASE_KEYSTORE_PATH']
            if (ksPath) {
                storeFile     file(ksPath)
                storePassword localProperties['RELEASE_KEYSTORE_PASSWORD']
                keyAlias      localProperties['RELEASE_KEY_ALIAS']
                keyPassword   localProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key if local.properties has no release
            // keystore configured, so assembleRelease still works locally
            // without secrets present — just won't be installable as an update.
            signingConfig localProperties['RELEASE_KEYSTORE_PATH'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
